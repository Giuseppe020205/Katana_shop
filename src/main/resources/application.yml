spring:
  application:
    name: katana-shop
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/katana_shop?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # In produzione impostare la variabile d'ambiente JWT_SECRET (almeno 32 caratteri)
    secret: ${JWT_SECRET:cambia-questo-segreto-solo-per-sviluppo-0123456789}
    expiration-ms: 3600000   # 1 ora

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
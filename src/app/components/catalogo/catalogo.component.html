<div class="catalogo-container">
  <h2>Catalogo Katane Artigianali</h2>

  <div *ngIf="caricamento" class="loading">Caricamento prodotti in corso...</div>
  <div *ngIf="errore" class="error-msg">{{ errore }}</div>

  <div *ngIf="!caricamento && katane.length > 0" class="katana-grid">
    <div *ngFor="let k of katane" class="katana-card">
      <div class="card-header">
        <h3>{{ k.nome }}</h3>
        <span class="badge">{{ k.tipo_acciaio || 'Acciaio Tradizionale' }}</span>
      </div>
      <div class="card-body">
        <p class="prezzo">€ {{ k.prezzo | number:'1.2-2' }}</p>
        <p class="disponibilita" [class.esaurito]="k.giacenza_magazzino <= 0">
          Disponibilità: {{ k.giacenza_magazzino > 0 ? k.giacenza_magazzino + ' pezzi' : 'Esaurito' }}
        </p>
      </div>
      <div class="card-footer">
        <button 
          [disabled]="k.giacenza_magazzino <= 0" 
          (click)="selezionaPerAcquisto(k)" 
          class="btn-acquista">
          Acquista Ora
        </button>
      </div>
    </div>
  </div>
</div>

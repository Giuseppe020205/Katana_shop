spring:
  application:
    name: katana-shop
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/katana_shop}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Postgres123!}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origin: ${CORS_ORIGIN:http://localhost:4200}
  jwt:
    # In produzione impostare la variabile d'ambiente JWT_SECRET (almeno 32 caratteri)
    secret: ${JWT_SECRET:cambia-questo-segreto-solo-per-sviluppo-0123456789}
    expiration-ms: 3600000   # 1 ora

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false